<!-- This JavaScript generates the noise from scratch -->
  <script>
    const canvas = document.getElementById('tv-noise');
    const ctx = canvas.getContext('2d');

    // We keep the internal resolution small (200x200) for high performance. 
    // CSS will stretch it to fit the screen, giving it that chunky, retro TV look.
    canvas.width = 200;
    canvas.height = 200;

    function renderNoise() {
      const imageData = ctx.createImageData(canvas.width, canvas.height);
      const data = imageData.data;
      
      // Loop through every pixel and assign a random black/white/gray color
      for (let i = 0; i < data.length; i += 4) {
        const color = Math.floor(Math.random() * 255);
        data[i] = color;       // Red
        data[i + 1] = color;   // Green
        data[i + 2] = color;   // Blue
        data[i + 3] = 255;     // Alpha (fully opaque)
      }
      
      // Put the newly generated pixels onto the canvas
      ctx.putImageData(imageData, 0, 0);
      
      // Ask the browser to run this function again on the next frame
      requestAnimationFrame(renderNoise);
    }

    // Start the loop
    renderNoise();
  </script>
